name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install browser for verification
        run: npx playwright install chromium
      - name: Test editor, exports and local OBS bridge
        run: npm test
        env:
          OVERLAY_TEST_OUTPUT: ${{ runner.temp }}/overlay-checks
      - name: Build Windows x64 ZIP
        run: npm run build:win -- --publish never
      - name: Verify packaged controller templates
        run: node tools/verify-packaged-models.cjs
      - name: Upload downloadable app
        uses: actions/upload-artifact@v4
        with:
          name: Overlay-Studio-Windows-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
