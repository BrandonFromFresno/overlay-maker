name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check main.cjs
          node --check app/studio.js
          node --check app/renderer.js
          node --check app/fonts.js
          node --check app/presets.js
          node --check app/themes.js
      - name: Test local OBS bridge
        run: node bridge-test.cjs
      - name: Build Windows x64 ZIP
        run: npm run build:win
      - name: Upload downloadable app
        uses: actions/upload-artifact@v4
        with:
          name: Overlay-Studio-Windows-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
